<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✏️ 梗圖產生器 — 全球迷因模板即時編輯器</title>
  <meta name="description" content="整合全球多平台迷因模板庫，支援即時文字編輯、貼圖、濾鏡、HD高畫質匯出" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#020206;--s1:rgba(12,12,20,.85);--s2:rgba(20,20,35,.7);
      --card:rgba(18,18,30,.65);--card-h:rgba(25,25,42,.75);
      --bdr:rgba(255,255,255,.04);--bdr2:rgba(255,255,255,.08);
      --ac:#a855f7;--ac2:#6d28d9;--ac3:#818cf8;--pink:#f472b6;--cyan:#22d3ee;
      --acg:linear-gradient(135deg,#a855f7 0%,#6366f1 50%,#818cf8 100%);
      --acg2:linear-gradient(135deg,#f472b6,#a855f7);
      --glow:0 0 60px rgba(168,85,247,.08);
      --t:#f0f0f5;--t2:rgba(255,255,255,.4);--t3:rgba(255,255,255,.12);
      --r:16px;--rs:12px;--rx:8px
    }
    *{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--t);font-family:'Inter','Noto Sans TC',sans-serif;line-height:1.5;overflow-x:hidden}
    body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(120,80,200,.1),transparent),radial-gradient(ellipse 60% 40% at 80% 100%,rgba(34,211,238,.04),transparent);pointer-events:none;z-index:0}
    button,input,select,textarea{font-family:inherit;outline:none}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:rgba(168,85,247,.15);border-radius:2px}
    select option{background:#0a0a14}a{color:var(--ac);text-decoration:none}
    @keyframes fu{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fi{from{opacity:0}to{opacity:1}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes glow{0%,100%{box-shadow:0 0 30px rgba(168,85,247,.08)}50%{box-shadow:0 0 50px rgba(168,85,247,.18)}}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
    @keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    .fu{animation:fu .5s cubic-bezier(.22,1,.36,1) both}
    .fi{animation:fi .4s ease both}
    .glow{animation:glow 3.5s ease-in-out infinite}

    /* ═══ NAV ═══ */
    .nav{position:sticky;top:0;z-index:100;backdrop-filter:blur(24px) saturate(180%);background:rgba(2,2,6,.75);border-bottom:1px solid var(--bdr);height:56px;display:flex;align-items:center;padding:0 24px}
    .nav-inner{max-width:1360px;margin:0 auto;display:flex;align-items:center;width:100%;gap:14px}
    .nav-logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;cursor:pointer;white-space:nowrap;letter-spacing:-.3px}
    .nav-logo .ic{width:32px;height:32px;border-radius:10px;background:var(--acg);display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 12px rgba(168,85,247,.25)}

    /* ═══ HERO ═══ */
    .hero{position:relative;padding:48px 24px 40px;text-align:center;overflow:hidden}
    .hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 90% 60% at 50% 0%,rgba(168,85,247,.08),transparent 70%);pointer-events:none}
    .hero h1{font-size:clamp(28px,5vw,48px);font-weight:900;letter-spacing:-1px;background:linear-gradient(135deg,#fff 20%,#a855f7 50%,#22d3ee 80%);background-size:200% auto;animation:gradientShift 4s ease infinite;-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
    .hero p{color:var(--t2);font-size:14px;max-width:500px;margin:0 auto}
    .hero-stats{display:flex;justify-content:center;gap:28px;margin-top:20px}
    .hero-stat{text-align:center}
    .hero-stat .num{font-size:28px;font-weight:900;background:var(--acg);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .hero-stat .lab{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px}

    /* ═══ BTN ═══ */
    .btn{padding:9px 18px;border-radius:var(--rs);border:none;cursor:pointer;font-size:11px;font-weight:700;transition:all .25s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;position:relative;overflow:hidden}
    .btn:hover{filter:brightness(1.15);transform:translateY(-1px)}.btn:active{transform:scale(.97)}
    .btn-p{background:var(--acg);color:#fff;box-shadow:0 4px 20px rgba(168,85,247,.2)}
    .btn-p::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);background-size:200% 100%;animation:shimmer 2.5s infinite}
    .btn-g{background:rgba(255,255,255,.04);border:1px solid var(--bdr2);color:var(--t2);backdrop-filter:blur(8px)}
    .btn-g:hover{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(168,85,247,.2)}
    .btn-s{padding:6px 12px;font-size:10px;border-radius:var(--rx)}

    /* ═══ INPUT ═══ */
    .inp{padding:10px 14px;border-radius:var(--rx);border:1px solid var(--bdr2);background:rgba(255,255,255,.03);color:#fff;font-size:13px;transition:all .25s;width:100%;backdrop-filter:blur(4px)}
    .inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(168,85,247,.08),0 0 20px rgba(168,85,247,.04)}
    .search-wrap{position:relative;max-width:600px;margin:0 auto}
    .search-wrap .ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--t3);pointer-events:none}
    .search-wrap input{width:100%;padding:14px 20px 14px 48px;border-radius:50px;border:1px solid var(--bdr2);background:rgba(255,255,255,.04);color:#fff;font-size:14px;backdrop-filter:blur(10px);transition:all .3s}
    .search-wrap input:focus{border-color:var(--ac);box-shadow:0 0 0 4px rgba(168,85,247,.07),0 0 30px rgba(168,85,247,.05)}

    /* ═══ PILL ═══ */
    .pill{padding:7px 16px;border-radius:50px;font-size:10px;cursor:pointer;transition:all .25s;border:1px solid var(--bdr);background:rgba(255,255,255,.02);color:var(--t2);display:inline-flex;align-items:center;gap:4px;white-space:nowrap;user-select:none;backdrop-filter:blur(4px)}
    .pill:hover{background:rgba(255,255,255,.05);border-color:var(--bdr2);transform:translateY(-1px)}.pill.on{background:rgba(168,85,247,.12);border-color:rgba(168,85,247,.3);color:#fff;font-weight:700;box-shadow:0 2px 12px rgba(168,85,247,.1)}

    /* ═══ CARDS ═══ */
    .card{transition:all .35s cubic-bezier(.22,1,.36,1);cursor:pointer;border-radius:var(--r);overflow:hidden;border:1px solid var(--bdr);background:var(--card);position:relative;backdrop-filter:blur(8px)}
    .card:hover{transform:translateY(-5px);box-shadow:0 16px 48px rgba(0,0,0,.5),0 0 30px rgba(168,85,247,.06);border-color:rgba(168,85,247,.15)}
    .card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;transition:transform .4s}.card:hover img{transform:scale(1.05)}
    .card .ov{position:absolute;inset:0;background:linear-gradient(transparent 25%,rgba(2,2,6,.9));pointer-events:none}
    .card .inf{position:absolute;bottom:0;left:0;right:0;padding:12px;z-index:2}
    .card .bdg{position:absolute;top:8px;right:8px;font-size:8px;padding:3px 9px;border-radius:20px;z-index:2;backdrop-filter:blur(8px);font-weight:600}
    .card .hot-badge{position:absolute;top:8px;left:8px;font-size:8px;padding:3px 9px;border-radius:20px;z-index:2;background:rgba(244,114,182,.12);color:#f472b6;border:1px solid rgba(244,114,182,.15);font-weight:700}

    /* ═══ FEATURED ═══ */
    .featured{border-radius:20px;overflow:hidden;position:relative;cursor:pointer;border:1px solid rgba(168,85,247,.15);background:var(--card);transition:all .35s}
    .featured:hover{transform:translateY(-3px);box-shadow:0 20px 60px rgba(168,85,247,.1)}
    .featured .f-img{width:100%;aspect-ratio:16/7;object-fit:cover;display:block;transition:transform .5s}
    .featured:hover .f-img{transform:scale(1.03)}
    .featured .f-ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,2,6,.95) 0%,rgba(2,2,6,.6) 40%,transparent 70%);pointer-events:none}
    .featured .f-info{position:absolute;bottom:0;left:0;top:0;display:flex;flex-direction:column;justify-content:center;padding:32px;z-index:2;max-width:55%}
    .featured .f-tag{display:inline-flex;align-items:center;gap:4px;font-size:9px;padding:4px 12px;border-radius:20px;background:rgba(244,114,182,.12);color:#f472b6;border:1px solid rgba(244,114,182,.15);font-weight:700;width:fit-content;margin-bottom:10px}

    /* ═══ SECTION ═══ */
    .sec{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;backdrop-filter:blur(12px)}

    /* ═══ AD ═══ */
    .ad{background:rgba(255,255,255,.01);border:1px dashed rgba(255,255,255,.04);border-radius:var(--r);padding:14px;text-align:center;color:var(--t3);font-size:10px;min-height:60px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px}

    /* ═══ GRID ═══ */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}

    /* ═══ LAYOUT ═══ */
    .layout{display:grid;grid-template-columns:1fr 260px;gap:22px;align-items:start}
    .side{position:sticky;top:68px;display:flex;flex-direction:column;gap:14px}

    /* ═══ EDITOR ═══ */
    .esplit{display:grid;grid-template-columns:1.15fr 1fr;gap:22px}

    /* ═══ RANGE ═══ */
    input[type="range"]{-webkit-appearance:none;height:3px;background:rgba(255,255,255,.08);border-radius:2px;cursor:pointer;outline:none}
    input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--acg);box-shadow:0 0 8px rgba(168,85,247,.3);cursor:pointer;border:2px solid rgba(255,255,255,.2)}

    /* ═══ LOADER ═══ */
    .loader{width:28px;height:28px;border:2px solid var(--bdr2);border-top-color:var(--ac);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}

    /* ═══ TOAST ═══ */
    .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--acg);color:#fff;padding:11px 26px;border-radius:var(--r);font-size:13px;font-weight:700;z-index:999;box-shadow:0 8px 30px rgba(168,85,247,.3);backdrop-filter:blur(8px)}

    /* ═══ RESPONSIVE ═══ */
    @media(max-width:1080px){.layout{grid-template-columns:1fr}.side{position:relative;top:0;flex-direction:row;flex-wrap:wrap;gap:10px}.side>*{flex:1;min-width:190px}.featured .f-info{max-width:70%}}
    @media(max-width:768px){.grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}.esplit{grid-template-columns:1fr}.hero h1{font-size:24px}.hero-stats{gap:16px}.hero-stat .num{font-size:22px}.featured .f-info{max-width:90%;padding:16px}.featured .f-img{aspect-ratio:16/9}}
    @media(max-width:480px){.grid{grid-template-columns:repeat(2,1fr);gap:8px}.card .inf{padding:8px}.card .inf .tt{font-size:11px!important}.hero{padding:28px 16px 24px}.hero-stats{flex-wrap:wrap;gap:12px}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <script>fetch('app.jsx').then(r=>r.text()).then(c=>{const t=Babel.transform(c,{presets:['react']}).code;const s=document.createElement('script');s.textContent=t;document.body.appendChild(s);}).catch(e=>{document.getElementById('root').innerHTML='<p style="color:red;padding:40px">'+e.message+'</p>';});</script>
</body>
</html>
